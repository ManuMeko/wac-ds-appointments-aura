
# =========================================================
# WAC D.S. - MODEL 01 - APPOINTMENTS
# INTEGRATION TEST PROFILE
# =========================================================
#
# Ubicacion:
# src/test/resources/application-test.properties
#
# Activacion desde clases JUnit:
# @ActiveProfiles("test")
#
# IMPORTANTE:
# Este perfil utiliza exclusivamente una base separada.
# No debe conectarse a wac_ds_appointments.
#
# La base wac_ds_appointments_test debe existir previamente.
# Este archivo NO crea automaticamente la base de datos.
# =========================================================

spring.application.name=appointments-api-test

# =========================================================
# DATASOURCE - ISOLATED POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/wac_ds_appointments_test

spring.datasource.username=${TEST_DB_USERNAME:wacds}

spring.datasource.password=${TEST_DB_PASSWORD:wacds_dev_password}

spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

# =========================================================
# SECURITY - TEST JWT
# =========================================================

app.security.jwt.secret=wac-ds-appointments-test-secret-isolated-2026-long-key

app.security.jwt.issuer=wac-ds-appointments-test

app.security.jwt.access-token-minutes=15

app.security.jwt.refresh-token-days=30

# =========================================================
# DISABLE DEVELOPMENT OWNER BOOTSTRAP
# =========================================================

app.bootstrap.dev-owner.enabled=false

app.bootstrap.dev-owner.business-slug=aura-studio

app.bootstrap.dev-owner.email=

app.bootstrap.dev-owner.password=

app.bootstrap.dev-owner.first-name=

app.bootstrap.dev-owner.last-name=

app.bootstrap.dev-taller-owner.business-slug=motorline-taller

app.bootstrap.dev-taller-owner.email=

app.bootstrap.dev-taller-owner.password=

app.bootstrap.dev-taller-owner.first-name=

app.bootstrap.dev-taller-owner.last-name=

# =========================================================
# PUBLIC BOOKING
# =========================================================

app.public-booking.frontend-base-url=http://localhost:3000

app.public-booking.management-path=/reservar/gestionar

# =========================================================
# DISABLE CONFIRMATION EMAILS
# =========================================================

app.public-booking.confirmation-email.enabled=false

app.public-booking.confirmation-email.subject=Test booking confirmation

# =========================================================
# DISABLE REAL EMAIL DELIVERY
# =========================================================

app.reminders.email.real-delivery-enabled=false

# =========================================================
# RESEND - TEST CONFIGURATION
# =========================================================

app.resend.api-key=

app.resend.base-url=https://api.resend.com

app.resend.from-email=onboarding@resend.dev

app.resend.from-name=WAC D.S. Test

app.resend.reply-to=

app.resend.connect-timeout-seconds=5

app.resend.read-timeout-seconds=15

app.resend.reminder-subject-prefix=Test reminder

# =========================================================
# DISABLE AUTOMATIC REMINDER SCHEDULER
# =========================================================

app.reminders.scheduler.enabled=false

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never

# =========================================================
# INTEGRATION TEST SAFETY
# =========================================================
#
# Las pruebas de concurrencia deberan:
#
# 1. Activar el perfil test explicitamente.
# 2. Comprobar que la conexion apunta a la base test.
# 3. Utilizar transacciones independientes.
# 4. Limitar los tiempos de espera.
# 5. Limpiar solamente sus propios datos de prueba.
# 6. No enviar emails reales.
#
# Nunca ejecutar operaciones destructivas contra
# la base de desarrollo o produccion.
#
# =========================================================
