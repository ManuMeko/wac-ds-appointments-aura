
# =========================================================
# WAC D.S. - MODEL 01 - APPOINTMENTS
# MAIN APPLICATION CONFIGURATION
# =========================================================
#
# Spring Boot 4.1.1
# Java 21
# PostgreSQL 17
# Flyway
#
# Este archivo contiene la configuracion principal.
#
# IMPORTANTE:
#
# No utilizar la base de datos principal para pruebas
# automatizadas que creen o modifiquen reservas.
#
# Las pruebas de integracion utilizaran:
#
# src/test/resources/application-test.properties
#
# y el perfil Spring:
#
# @ActiveProfiles("test")
#
# La conexion de desarrollo se mantiene intacta.
#
# =========================================================

spring.application.name=appointments-api


# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8080}


# =========================================================
# DATASOURCE - POSTGRESQL
# =========================================================
#
# Base de datos habitual de desarrollo.
#
# NO utilizarla para pruebas destructivas de concurrencia.
#
# La futura base de test sera:
#
# wac_ds_appointments_test
#
# Su configuracion se realizara exclusivamente
# dentro de application-test.properties.
#
# En produccion se utilizaran variables de entorno.
#
# DB_URL
# DB_USERNAME
# DB_PASSWORD
#
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wac_ds_appointments}

spring.datasource.username=${DB_USERNAME:wacds}

spring.datasource.password=${DB_PASSWORD:wacds_dev_password}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
#
# validate:
#
# Hibernate comprueba que las entidades sean compatibles
# con el esquema existente.
#
# No crea ni modifica automaticamente las tablas.
#
# Flyway sigue siendo responsable de las migraciones.
#
# open-in-view=false:
#
# Evita mantener abierto el contexto de persistencia
# durante toda la peticion HTTP.
#
# Las operaciones de escritura deben ejecutarse
# dentro de transacciones correctamente definidas.
#
# =========================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# TRANSACTION MANAGEMENT
# =========================================================
#
# Las operaciones de reservas utilizan transacciones
# gestionadas desde los servicios Spring.
#
# Los bloqueos PostgreSQL FOR UPDATE requieren
# una transaccion activa.
#
# El nivel de aislamiento observado actualmente es:
#
# READ_COMMITTED
#
# No se modifica el aislamiento global desde aqui.
#
# La seguridad concurrente se comprobara mediante
# pruebas especificas de integracion.
#
# IMPORTANTE:
#
# No activar aislamiento SERIALIZABLE globalmente
# sin evaluar antes su impacto en las operaciones.
#
# =========================================================


# =========================================================
# FLYWAY
# =========================================================
#
# Flyway controla las migraciones SQL.
#
# Actualmente existen 15 migraciones validadas.
#
# El esquema principal no se modificara para
# preparar las pruebas de concurrencia.
#
# =========================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration


# =========================================================
# SECURITY - JWT
# =========================================================
#
# JWT_SECRET debe configurarse obligatoriamente
# con un secreto criptografico seguro en produccion.
#
# El valor por defecto es exclusivamente local.
#
# Se recomienda utilizar un secreto aleatorio
# de al menos 32 bytes para HS256.
#
# Nunca incluir secretos reales en el repositorio.
#
# =========================================================

app.security.jwt.secret=${JWT_SECRET:wac-ds-appointments-dev-secret-change-me-2026-very-long-key}

# Emisor esperado en los JWT.

app.security.jwt.issuer=${JWT_ISSUER:wac-ds-appointments}

# Duracion del access token en minutos.

app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}

# Duracion del refresh token en dias.

app.security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:30}


# =========================================================
# RATE LIMIT
# =========================================================
#
# Ventana fija en memoria, sin dependencia nueva.
#
# Desactivado fuera de produccion para no interferir
# con el desarrollo ni con las pruebas.
#
# El perfil prod lo activa en application-prod.properties.
#
# Cubre unicamente:
#
# POST /api/v1/auth/login
# POST /api/v1/public/bookings
#
# =========================================================

app.security.rate-limit.enabled=${APP_SECURITY_RATE_LIMIT_ENABLED:false}

app.security.rate-limit.login-per-minute=${APP_SECURITY_RATE_LIMIT_LOGIN_PER_MINUTE:10}

app.security.rate-limit.public-booking-per-minute=${APP_SECURITY_RATE_LIMIT_PUBLIC_BOOKING_PER_MINUTE:10}

app.security.rate-limit.window-seconds=${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}


# =========================================================
# DEVELOPMENT AUTH BOOTSTRAP
# =========================================================
#
# Crea el primer OWNER de desarrollo de Aura Studio.
#
# Se encuentra DESACTIVADO por defecto.
#
# Para activarlo:
#
# APP_BOOTSTRAP_DEV_OWNER_ENABLED=true
#
# Se requieren:
#
# DEV_OWNER_EMAIL
# DEV_OWNER_PASSWORD
# DEV_OWNER_FIRST_NAME
# DEV_OWNER_LAST_NAME
#
# Owner opcional de Motorline Taller.
# Solo se crea con el bootstrap activado y estas dos
# variables definidas a la vez:
#
# DEV_TALLER_OWNER_EMAIL
# DEV_TALLER_OWNER_PASSWORD
#
# Si ambas quedan vacias, Motorline no se modifica.
#
# Nunca escribir contrasenas reales en este archivo.
#
# La contrasena se almacena mediante BCrypt.
#
# IMPORTANTE:
#
# El perfil test mantendra desactivado el bootstrap.
#
# =========================================================

app.bootstrap.dev-owner.enabled=${APP_BOOTSTRAP_DEV_OWNER_ENABLED:false}

# Negocio inicial.

app.bootstrap.dev-owner.business-slug=${DEV_OWNER_BUSINESS_SLUG:aura-studio}

# Credenciales y datos del OWNER.

app.bootstrap.dev-owner.email=${DEV_OWNER_EMAIL:}

app.bootstrap.dev-owner.password=${DEV_OWNER_PASSWORD:}

app.bootstrap.dev-owner.first-name=${DEV_OWNER_FIRST_NAME:}

app.bootstrap.dev-owner.last-name=${DEV_OWNER_LAST_NAME:}

# Owner opcional de motorline-taller.
# La contrasena no se copia de la cuenta de Aura.

app.bootstrap.dev-taller-owner.business-slug=${DEV_TALLER_OWNER_BUSINESS_SLUG:motorline-taller}

app.bootstrap.dev-taller-owner.email=${DEV_TALLER_OWNER_EMAIL:}

app.bootstrap.dev-taller-owner.password=${DEV_TALLER_OWNER_PASSWORD:}

app.bootstrap.dev-taller-owner.first-name=${DEV_TALLER_OWNER_FIRST_NAME:Owner}

app.bootstrap.dev-taller-owner.last-name=${DEV_TALLER_OWNER_LAST_NAME:Motorline}


# =========================================================
# PUBLIC BOOKING - FRONTEND
# =========================================================
#
# URL publica del frontend utilizada para crear
# enlaces enviados al cliente.
#
# Desarrollo:
#
# http://localhost:3000
#
# Produccion:
#
# PUBLIC_FRONTEND_BASE_URL=https://reservas.midominio.es
#
# No incluir una barra final en produccion.
#
# =========================================================

app.public-booking.frontend-base-url=${PUBLIC_FRONTEND_BASE_URL:http://localhost:3000}


# =========================================================
# PUBLIC BOOKING - MANAGEMENT PATH
# =========================================================
#
# Ruta publica para gestionar reservas.
#
# El appointmentId se incorpora como query string.
#
# El managementToken se incorpora como fragmento.
#
# Ejemplo:
#
# /reservar/gestionar?appointmentId=123#token=SECRET
#
# El fragmento:
#
# - No se transmite al servidor en la solicitud HTTP.
# - No forma parte de la cabecera Referer HTTP.
# - No debe escribirse en logs.
# - Se procesa desde el frontend.
# - Se almacena temporalmente en sessionStorage.
# - Se elimina de la URL mediante history.replaceState.
#
# IMPORTANTE:
#
# Esto protege el transporte inicial del fragmento.
#
# La autorizacion efectiva sigue dependiendo
# del backend y de la validacion del token.
#
# =========================================================

app.public-booking.management-path=${PUBLIC_BOOKING_MANAGEMENT_PATH:/reservar/gestionar}


# =========================================================
# PUBLIC BOOKING - CONFIRMATION EMAIL
# =========================================================
#
# Activa el email de confirmacion tras crear
# correctamente una reserva publica.
#
# El envio ocurre AFTER_COMMIT.
#
# Primero:
#
# - Se persiste la reserva.
# - Se confirma la transaccion.
#
# Despues:
#
# - Se intenta enviar el email.
#
# Un error del proveedor de email no debe
# revertir una reserva confirmada.
#
# IMPORTANTE:
#
# En el futuro perfil test desactivaremos
# expresamente los envios de confirmacion.
#
# =========================================================

app.public-booking.confirmation-email.enabled=${PUBLIC_BOOKING_CONFIRMATION_EMAIL_ENABLED:true}

# Asunto del email de confirmacion.
# Se conserva escape Unicode para compatibilidad
# con el formato application.properties.

app.public-booking.confirmation-email.subject=${PUBLIC_BOOKING_CONFIRMATION_EMAIL_SUBJECT:Tu reserva est\u00e1 confirmada}


# =========================================================
# REMINDERS - EMAIL DELIVERY
# =========================================================
#
# Controla la entrega real de emails mediante Resend.
#
# false:
#
# Se mantiene desactivada la entrega real.
#
# true:
#
# Permite utilizar el proveedor externo configurado.
#
# En desarrollo puede utilizarse el mecanismo
# de entrega simulado correspondiente.
#
# IMPORTANTE:
#
# Las pruebas automatizadas no deben enviar emails
# a clientes reales.
#
# El futuro perfil test forzara false.
#
# =========================================================

app.reminders.email.real-delivery-enabled=${REMINDER_EMAIL_REAL_DELIVERY_ENABLED:false}


# =========================================================
# RESEND - API
# =========================================================
#
# Proveedor de correo transaccional.
#
# Se utiliza para:
#
# - Confirmaciones de reservas.
# - Recordatorios de citas.
# - Notificaciones operativas futuras.
#
# La API KEY se obtiene desde:
#
# RESEND_API_KEY
#
# Nunca guardar la clave real aqui.
#
# Nunca subirla a Git.
#
# Nunca imprimirla en logs.
#
# =========================================================

app.resend.api-key=${RESEND_API_KEY:}

# Endpoint del proveedor.

app.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}


# =========================================================
# RESEND - SENDER
# =========================================================
#
# Configuracion del remitente.
#
# onboarding@resend.dev es exclusivamente
# un remitente de pruebas.
#
# En produccion se debe utilizar un dominio
# correctamente verificado.
#
# =========================================================

app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Nombre visible del remitente.

app.resend.from-name=${RESEND_FROM_NAME:WAC D.S. Appointments}

# Direccion Reply-To opcional.

app.resend.reply-to=${RESEND_REPLY_TO:}


# =========================================================
# RESEND - HTTP
# =========================================================
#
# Limites defensivos para comunicaciones
# con el proveedor externo.
#
# Se evita mantener conexiones bloqueadas
# indefinidamente.
#
# =========================================================

app.resend.connect-timeout-seconds=${RESEND_CONNECT_TIMEOUT_SECONDS:5}

app.resend.read-timeout-seconds=${RESEND_READ_TIMEOUT_SECONDS:15}


# =========================================================
# RESEND - EMAIL CONTENT
# =========================================================

app.resend.reminder-subject-prefix=${RESEND_REMINDER_SUBJECT_PREFIX:Recordatorio de tu cita}


# =========================================================
# REMINDER SCHEDULER
# =========================================================
#
# Procesamiento automatico de recordatorios.
#
# true:
#
# Habilita el scheduler.
#
# false:
#
# Desactiva la ejecucion automatica.
#
# IMPORTANTE:
#
# Durante las pruebas de integracion se debe
# desactivar para impedir procesamiento concurrente
# ajeno al escenario que se este verificando.
#
# El perfil test utilizara false.
#
# =========================================================

app.reminders.scheduler.enabled=${REMINDER_SCHEDULER_ENABLED:true}


# =========================================================
# ACTUATOR
# =========================================================
#
# Endpoints habilitados:
#
# /actuator/health
# /actuator/info
#
# Los detalles de salud se muestran
# segun autorizacion.
#
# =========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=when-authorized


# =========================================================
# INTEGRATION TESTING - SAFETY NOTES
# =========================================================
#
# El perfil de pruebas se definira en:
#
# apps/api/src/test/resources/application-test.properties
#
# Configuracion prevista:
#
# - Base PostgreSQL independiente.
# - Mismas migraciones Flyway.
# - ddl-auto=validate.
# - Bootstrap OWNER desactivado.
# - Emails reales desactivados.
# - Scheduler de recordatorios desactivado.
#
# Para las nuevas clases de integracion utilizaremos:
#
# @SpringBootTest
# @ActiveProfiles("test")
#
# IMPORTANTE:
#
# Los tests actuales sin @ActiveProfiles("test")
# siguen utilizando la configuracion habitual.
#
# La separacion definitiva se verificara antes
# de introducir pruebas que escriban en PostgreSQL.
#
# No crear tests destructivos contra la base
# wac_ds_appointments.
#
# =========================================================
