# =========================================================
# WAC D.S. - MODEL 01 - APPOINTMENTS
# PRODUCTION PROFILE
# =========================================================
#
# Se activa con:
#
# SPRING_PROFILES_ACTIVE=prod
#
# No incluye secretos. Los valores salen del entorno.
# =========================================================

# Sin valor por defecto: si JWT_SECRET no existe, Spring no arranca.

app.security.jwt.secret=${JWT_SECRET}

# Orígenes del navegador, separados por comas.
# Si falta la variable, el arranque falla.

app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS}

# El guard de producción rechaza el valor true.

app.bootstrap.dev-owner.enabled=${APP_BOOTSTRAP_DEV_OWNER_ENABLED:false}

# Rate limit en memoria para login y reserva pública.

app.security.rate-limit.enabled=${APP_SECURITY_RATE_LIMIT_ENABLED:true}

app.security.rate-limit.login-per-minute=${APP_SECURITY_RATE_LIMIT_LOGIN_PER_MINUTE:10}

app.security.rate-limit.public-booking-per-minute=${APP_SECURITY_RATE_LIMIT_PUBLIC_BOOKING_PER_MINUTE:10}

app.security.rate-limit.window-seconds=${APP_SECURITY_RATE_LIMIT_WINDOW_SECONDS:60}

# La API no publica puerto: solo Caddy le habla.
# Spring Boot 4.1 registra ForwardedHeaderFilter con esta
# estrategia y reescribe getRemoteAddr() desde X-Forwarded-For.
# El rate limit lee esa dirección ya procesada.

server.forward-headers-strategy=framework

# /actuator/health sigue público, sin detalles de la base.

management.endpoint.health.show-details=never
